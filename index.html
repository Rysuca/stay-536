<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Drift</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="startScreen">
    <h1 class="title">ORBITAL DRIFT</h1>
    <p class="rules">Rotate the duo with the <span class="key">Left/Right</span> arrows or <span class="key">A/D</span> keys so both spheres slip through the gaps. Don't clip the walls!</p>
    <div class="themePicker">
      <span class="themePickerLabel">THEME:</span>
      <div id="themeButtons" class="themeButtons"></div>
    </div>
    <button id="startBtn">START</button>
  </div>
  <div id="gameOverScreen" style="display: none;">
    <h1 class="title">GAME OVER</h1>
    <p class="gameOverScore">Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">RESTART</button>
  </div>
  <div id="pauseScreen" style="display: none;">
    <h1 class="title">PAUSED</h1>
    <div class="pauseMenu">
      <button id="resumeBtn">RESUME</button>
      <button id="pauseRestartBtn">RESTART</button>
      <button id="pauseMenuBtn">MAIN MENU</button>
      <button id="pauseSettingsBtn">SETTINGS</button>
    </div>
  </div>
  <div id="hud">
    <span id="hudScore">0</span>
    <span id="hudTime">00:00</span>
    <button id="pauseBtn" type="button" style="pointer-events: auto;">PAUSE</button>
  </div>
</body>
</html>
