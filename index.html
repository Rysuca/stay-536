<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Drift</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="startScreen">
    <h1 class="title">ORBITAL DRIFT</h1>
    <p class="rules">Rotate the duo with the <span class="key">Left/Right</span> arrows or <span class="key">A/D</span> keys so both spheres slip through the gaps. Don't clip the walls!</p>
    <button id="startBtn">START</button>
  </div>
  <div id="gameOverScreen"></div>
  <div id="hud">
    <div id="hudScore"></div>
  </div>
</body>
</html>
